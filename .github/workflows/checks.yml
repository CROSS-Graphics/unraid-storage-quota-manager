name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Backend simulations
        run: sudo php tests/run.php && php tests/updates.php
      - name: DOM tests
        run: npm ci --ignore-scripts && npm test
      - name: Source package and publication metadata
        run: python3 tools/build.py && python3 tools/check_package.py && python3 tools/validate_publication.py
